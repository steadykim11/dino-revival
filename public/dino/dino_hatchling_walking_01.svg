<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 꼬리 (위로 살짝) -->
  <path d="M 30 62 Q 18 55 14 48" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 몸 (살짝 앞으로 기울임) -->
  <ellipse cx="50" cy="60" rx="26" ry="19" fill="currentColor"/>
  <!-- 머리 -->
  <circle cx="68" cy="48" r="14" fill="currentColor"/>
  <!-- 눈 -->
  <circle cx="72" cy="46" r="2.5" fill="white"/>
  <circle cx="73" cy="46" r="1.3" fill="#222"/>
  <!-- 다리 왼 (앞으로 뻗음) -->
  <rect x="38" y="76" width="6" height="14" rx="2" fill="currentColor" transform="rotate(-15 41 83)"/>
  <!-- 다리 오른 (뒤로 뻗음) -->
