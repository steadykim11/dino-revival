name: Collect probe

# 공공데이터포털 게이트웨이(apis.data.go.kr)가 GitHub 러너(클라우드 IP)의 호출을
# 받아주는지 확인하는 수동 실행용 워크플로 (ADR 25 후속).
#
# KPX만 호출하고 DB에는 쓰지 않는다 (--dry-run).
# 필요한 Secret: KPX_API_KEY

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: KPX dry-run (3회)
        env:
          KPX_API_KEY: ${{ secrets.KPX_API_KEY }}
        run: |
          for i in 1 2 3; do
            pnpm exec tsx jobs/collect.ts --dry-run
            sleep 5
          done
