name: Collect

# 5분마다 KPX 전력 데이터를 수집해 DB에 기록하고 던전 모니터를 실행한다 (ADR 26).
#
# 필요한 Secrets: DATABASE_URL, KPX_API_KEY
#
# - GitHub의 schedule은 정시를 보장하지 않는다. 수 분 지연되거나 혼잡 시 건너뛸 수 있다.
#   화면의 "데이터 지연"은 15분 넘게 비어야 표시된다 (lib/world/staleness.ts).
# - 레포에 60일간 활동이 없으면 GitHub이 schedule을 자동으로 끈다. Actions 탭에서 다시 켠다.
# - 수집에 실패하면 종료 코드 1로 실행이 실패 처리되고 GitHub이 메일로 알린다.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# 앞 실행이 끝나지 않았으면 새 실행은 기다린다 (동시에 두 번 쓰지 않도록)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall이 prisma generate를 실행한다
      - run: pnpm install --frozen-lockfile

      - name: Collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KPX_API_KEY: ${{ secrets.KPX_API_KEY }}
        run: pnpm exec tsx jobs/collect.ts
